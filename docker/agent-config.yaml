# Agent 默认配置 (Docker 内部)
agent:
  agentId: ${AGENT_ID:-agent-docker-001}
  serverId: ${SERVER_ID:-docker-server}
  environment: ${ENV:-prod}
  backendUrl: ${BACKEND_URL:-http://backend:8081}
  schedulerPoolSize: 4
  sendTimeoutMs: 5000

  connectors:
    - type: JVM
      enabled: true
      intervalMs: 30000
      properties:
        jvmType: hotspot

    - type: LINUX
      enabled: true
      intervalMs: 30000
      properties:
        procPath: /proc

    - type: REDIS
      enabled: ${REDIS_ENABLED:-false}
      intervalMs: 30000
      properties:
        host: ${REDIS_HOST:-redis}
        port: ${REDIS_PORT:-6379}
        password: ${REDIS_PASSWORD:-}

    - type: MYSQL
      enabled: ${MYSQL_ENABLED:-false}
      intervalMs: 30000
      properties:
        host: ${MYSQL_HOST:-mysql}
        port: ${MYSQL_PORT:-3306}
        user: ${MYSQL_USER:-root}
        password: ${MYSQL_PASSWORD:-}
        database: ${MYSQL_DATABASE:-aipe_metadata}
