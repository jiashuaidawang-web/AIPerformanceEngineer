server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 (history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api/v1/resources {
        proxy_pass http://resource:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/observations {
        proxy_pass http://observation:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/relationships {
        proxy_pass http://relationship:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/topology {
        proxy_pass http://relationship:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/timelines {
        proxy_pass http://timeline:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/evidences {
        proxy_pass http://evidence:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/knowledge {
        proxy_pass http://knowledge:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/recommendations {
        proxy_pass http://recommendation:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/executions {
        proxy_pass http://execution:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/agents {
        proxy_pass http://config-manager:8080;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
