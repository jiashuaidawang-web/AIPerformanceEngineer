# ============================================================
# AI Performance Engineer - Agent Configuration (VM Deploy)
# ============================================================

agent:
  agentId: ${AGENT_ID:-agent-001}
  serverId: ${SERVER_ID:-server-001}
  environment: ${ENV:-dev}
  backendUrl: ${BACKEND_URL:-http://localhost:8081}
  schedulerPoolSize: 4
  sendTimeoutMs: 5000
  connectors:
    - type: JVM
      enabled: true
      intervalMs: 30000
      properties:
        jvmType: hotspot

    - type: LINUX
      enabled: true
      intervalMs: 30000
      properties:
        procPath: /proc

    - type: REDIS
      enabled: true
      intervalMs: 30000
      properties:
        host: 124.223.220.245
        port: "6379"
        password: "pamirs@123"

    - type: MYSQL
      enabled: true
      intervalMs: 30000
      properties:
        host: 124.223.220.245
        port: "3306"
        user: root
        password: astock_root
        database: aipe_metadata
