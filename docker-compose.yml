version: '3.8'

services:
  # ========================================================================
  # Part A: 基础设施 —— MySQL + ClickHouse
  # ========================================================================
  aipe-mysql:
    image: mysql:8.0.33
    container_name: aipe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aipe_metadata
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - aipe-mysql-data:/var/lib/mysql
    networks:
      - aipe-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+08:00'

  aipe-clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: aipe-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - aipe-clickhouse-data:/var/lib/clickhouse
    networks:
      - aipe-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      TZ: Asia/Shanghai

  # ========================================================================
  # Part B: Domain Engine × 8
  # ========================================================================
  aipe-resource:
    image: aipe/resource:1.0.0
    build:
      context: .
      dockerfile: aipe-resource/Dockerfile
    container_name: aipe-resource
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_MYSQL_URL: "jdbc:mysql://aipe-mysql:3306/aipe_metadata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_MYSQL_USERNAME: root
      SPRING_DATASOURCE_MYSQL_PASSWORD: root
    ports:
      - "8082:8082"
    networks:
      - aipe-network
    depends_on:
      aipe-mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  aipe-observation:
    image: aipe/observation:1.0.0
    build:
      context: .
      dockerfile: aipe-observation/Dockerfile
    container_name: aipe-observation
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_CLICKHOUSE_JDBC_URL: "jdbc:clickhouse://aipe-clickhouse:8123/metric_observation"
      SPRING_DATASOURCE_CLICKHOUSE_USERNAME: default
      SPRING_DATASOURCE_CLICKHOUSE_PASSWORD: pamirs@123
    ports:
      - "8083:8083"
    networks:
      - aipe-network
    depends_on:
      aipe-clickhouse:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

  aipe-relationship:
    image: aipe/relationship:1.0.0
    build:
      context: .
      dockerfile: aipe-relationship/Dockerfile
    container_name: aipe-relationship
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_MYSQL_URL: "jdbc:mysql://aipe-mysql:3306/aipe_metadata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_MYSQL_USERNAME: root
      SPRING_DATASOURCE_MYSQL_PASSWORD: root
    ports:
      - "8084:8084"
    networks:
      - aipe-network
    depends_on:
      aipe-mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  aipe-timeline:
    image: aipe/timeline:1.0.0
    build:
      context: .
      dockerfile: aipe-timeline/Dockerfile
    container_name: aipe-timeline
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_CLICKHOUSE_JDBC_URL: "jdbc:clickhouse://aipe-clickhouse:8123/metric_observation"
      SPRING_DATASOURCE_CLICKHOUSE_USERNAME: default
      SPRING_DATASOURCE_CLICKHOUSE_PASSWORD: pamirs@123
    ports:
      - "8085:8085"
    networks:
      - aipe-network
    depends_on:
      aipe-clickhouse:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aipe-evidence:
    image: aipe/evidence:1.0.0
    build:
      context: .
      dockerfile: aipe-evidence/Dockerfile
    container_name: aipe-evidence
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_MYSQL_URL: "jdbc:mysql://aipe-mysql:3306/aipe_metadata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_MYSQL_USERNAME: root
      SPRING_DATASOURCE_MYSQL_PASSWORD: root
      SPRING_DATASOURCE_CLICKHOUSE_JDBC_URL: "jdbc:clickhouse://aipe-clickhouse:8123/metric_observation"
      SPRING_DATASOURCE_CLICKHOUSE_USERNAME: default
      SPRING_DATASOURCE_CLICKHOUSE_PASSWORD: pamirs@123
    ports:
      - "8086:8086"
    networks:
      - aipe-network
    depends_on:
      aipe-mysql:
        condition: service_healthy
      aipe-clickhouse:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aipe-knowledge:
    image: aipe/knowledge:1.0.0
    build:
      context: .
      dockerfile: aipe-knowledge/Dockerfile
    container_name: aipe-knowledge
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_MYSQL_URL: "jdbc:mysql://aipe-mysql:3306/aipe_metadata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_MYSQL_USERNAME: root
      SPRING_DATASOURCE_MYSQL_PASSWORD: root
    ports:
      - "8087:8087"
    networks:
      - aipe-network
    depends_on:
      aipe-mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aipe-recommendation:
    image: aipe/recommendation:1.0.0
    build:
      context: .
      dockerfile: aipe-recommendation/Dockerfile
    container_name: aipe-recommendation
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_MYSQL_URL: "jdbc:mysql://aipe-mysql:3306/aipe_metadata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_MYSQL_USERNAME: root
      SPRING_DATASOURCE_MYSQL_PASSWORD: root
    ports:
      - "8088:8088"
    networks:
      - aipe-network
    depends_on:
      aipe-mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aipe-execution:
    image: aipe/execution:1.0.0
    build:
      context: .
      dockerfile: aipe-execution/Dockerfile
    container_name: aipe-execution
    restart: unless-stopped
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_MYSQL_URL: "jdbc:mysql://aipe-mysql:3306/aipe_metadata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_MYSQL_USERNAME: root
      SPRING_DATASOURCE_MYSQL_PASSWORD: root
    ports:
      - "8089:8089"
    networks:
      - aipe-network
    depends_on:
      aipe-mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aipe-mysql-data:
    driver: local
  aipe-clickhouse-data:
    driver: local

networks:
  aipe-network:
    driver: bridge
