# ============================================================
# AI Performance Engineer - Agent Configuration
# ============================================================

agent:
  agentId: agent-001
  serverId: server-001
  environment: dev
  backendUrl: http://100.97.74.45:8081
  schedulerPoolSize: 4
  sendTimeoutMs: 5000
  connectors:
    - type: JVM
      enabled: true
      intervalMs: 30000
      properties:
        jvmType: hotspot

    - type: LINUX
      enabled: true
      intervalMs: 30000
      properties:
        procPath: /proc

    - type: REDIS
      enabled: false
      intervalMs: 30000
      properties:
        host: localhost
        port: 6379
        password: ""

    - type: MYSQL
      enabled: true
      intervalMs: 30000
      properties:
        host: 100.97.74.45
        port: "3306"
        user: root
        password: astock_root
